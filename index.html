<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snabbit TV — trial scheduler</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#ffeef6;overflow:hidden;}
  #frame{display:block;border:0;width:100vw;height:100vh;}
</style>
</head>
<body>
  <iframe id="frame" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>
<script>
  // ---- TRIAL CONFIG (fast cycle to verify the swap works) ----
  var DASH_URL  = "countdown.html";                       // the countdown dashboard
  var CANVA_URL = "https://www.canva.com/design/DAHNjxNgkdg/qfku9xvynEL3cofIvBxaew/view?embed";  // Canva EMBED link (frame-allowed; verified rendering)
  var PHASE_MS  = 120000;                                  // 2 minutes per phase
  // Cycle order: dashboard first, then Canva, repeat.
  var PHASES = ["dash", "canva"];
  // ------------------------------------------------------------

  var frame = document.getElementById("frame");
  var i = -1;

  function show(){
    i = (i + 1) % PHASES.length;
    var p = PHASES[i];
    if (p === "dash"){
      frame.src = DASH_URL + "?v=" + Date.now();   // cache-buster -> always fresh data
    } else {
      frame.src = CANVA_URL;                        // re-set each cycle so it reloads fresh
    }
  }

  show();                       // start on the dashboard immediately
  setInterval(show, PHASE_MS);  // auto-swap every 2 min, reloads itself, no manual touch
</script>
</body>
</html>
